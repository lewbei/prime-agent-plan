name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio anyio httpx

      - name: Run pytest (Full suite)
        run: |
          PYTHONPATH=src pytest -v

      - name: Verify test portability (without external corpus)
        run: |
          PLANNING_CORPUS=/nonexistent PYTHONPATH=src pytest -v

      - name: Verify plan_mode.selfcheck()
        run: |
          PYTHONPATH=src python -c "import plan_mode; res = plan_mode.selfcheck(run_pytest=False); print(res); assert res['ok']"
