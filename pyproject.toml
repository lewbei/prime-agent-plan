[project]
name = "plan"
version = "0.14.0"
description = "Plan mode - iterative self-improving plan synthesis, rubric scoring, STRIPS simulation, MCTS search, and Cordis spatiotemporal composability runtime."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plan", "src/plan_mode"]
