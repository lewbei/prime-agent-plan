[project]
name = "plan"
version = "0.1.0"
description = "Plan mode - iterative self-improving plan synthesis, rubric scoring, STRIPS simulation, MCTS search, and Cordis spatiotemporal composability runtime."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
plan = "rlm.skill:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plan", "src/plan_mode"]
