[project]
name = "plan"
version = "0.15.0"
description = "Plan mode - iterative self-improving plan synthesis, rubric scoring, STRIPS simulation, MCTS search, and Cordis spatiotemporal composability runtime."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.24.0",
    "pydantic>=2.0.0,<3.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.20.0",
    "anyio>=3.7.0",
    "typeguard>=4.0.0",
]
# The self-verification policy is inherited by Prime. This extra only installs
# the external probabilistic/logprob backend; deterministic Prime remains
# operational without provider credentials.
verification = [
    "llm-verifier>=0.2.0,<0.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plan", "src/plan_mode", "benchmarks"]
